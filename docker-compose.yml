services:
  postgres:
    image: postgres:16-alpine
    container_name: nexora-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexora}
      POSTGRES_USER: ${POSTGRES_USER:-nexora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexora}
    ports:
      - "5432:5432"
    volumes:
      - nexora_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexora} -d ${POSTGRES_DB:-nexora}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  nexora-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexora-backend
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-nexora}:${POSTGRES_PASSWORD:-nexora}@postgres:5432/${POSTGRES_DB:-nexora}
      - APP_PORT=8100
      - TEST_DB_HOST=postgres
      - TEST_DB_PORT=5432
      - TEST_DB_USER=${POSTGRES_USER:-nexora}
      - TEST_DB_PASSWORD=${POSTGRES_PASSWORD:-nexora}
      - TEST_DB_NAME=nexora_test
    ports:
      - "8100:8100"
    volumes:
      - ./:/app
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  nexora_postgres_data:
